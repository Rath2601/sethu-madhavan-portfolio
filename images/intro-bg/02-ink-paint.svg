<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191411"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="6" seed="24" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#ib)"/>
  <g filter="url(#ink)" opacity="0.8">
    <ellipse cx="620" cy="440" rx="360" ry="260" fill="#39291a"/>
    <ellipse cx="1050" cy="620" rx="300" ry="240" fill="#241a12"/>
    <ellipse cx="430" cy="720" rx="220" ry="180" fill="#4a3416"/>
    <ellipse cx="1200" cy="300" rx="180" ry="150" fill="#c9a24b" opacity="0.5"/>
  </g>
</svg>
