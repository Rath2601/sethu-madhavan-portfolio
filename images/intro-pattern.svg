<?xml version="1.0" encoding="UTF-8"?>
<!-- Line-art tile for the "A Short Introduction" section background.
     8 small film / writing icons distributed inside a 220×220 tile so the
     pattern feels dense without ever crowding the text. Stroke colour
     matches the site accent (lavender). Opacity is set in CSS so the
     pattern can be tuned without re-saving this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <g fill="none" stroke="#b3a794" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Clapper board -->
    <g transform="translate(28 28) rotate(-10 16 16)">
      <rect x="0" y="10" width="32" height="20" rx="1.5"/>
      <line x1="0" y1="18" x2="32" y2="18"/>
      <path d="M2 10 L6 3 L10 10 M9 10 L13 3 L17 10 M16 10 L20 3 L24 10 M23 10 L27 3 L31 10"/>
    </g>

    <!-- Camera -->
    <g transform="translate(130 26) rotate(8 16 15)">
      <rect x="0" y="8" width="32" height="22" rx="2"/>
      <path d="M9 8 L11 3 L21 3 L23 8"/>
      <circle cx="16" cy="19" r="5.5"/>
      <circle cx="27" cy="13" r="1"/>
    </g>

    <!-- Star -->
    <g transform="translate(184 82)">
      <path d="M11 1 L13 8 L20 8 L14 13 L16 20 L11 16 L6 20 L8 13 L2 8 L9 8 Z"/>
    </g>

    <!-- Pencil -->
    <g transform="translate(20 108) rotate(25 14 14)">
      <path d="M0 30 L4 26 L24 6 L28 10 L8 30 Z"/>
      <line x1="22" y1="4" x2="28" y2="10"/>
    </g>

    <!-- Coffee cup -->
    <g transform="translate(106 102)">
      <path d="M3 8 L3 26 Q3 31 8 31 L20 31 Q25 31 25 26 L25 8 Z"/>
      <path d="M25 13 Q31 13 31 19 Q31 25 25 25"/>
      <path d="M8 1 Q8 4 9 5 M14 1 Q14 4 15 5 M20 1 Q20 4 21 5"/>
    </g>

    <!-- Mini typewriter -->
    <g transform="translate(150 148) rotate(-6 16 14)">
      <rect x="0" y="10" width="32" height="17" rx="2"/>
      <path d="M5 10 L5 4 L27 4 L27 10"/>
      <line x1="6" y1="21" x2="26" y2="21"/>
      <circle cx="8"  cy="15" r="0.9" fill="#6b4ea8" stroke="none"/>
      <circle cx="13" cy="15" r="0.9" fill="#6b4ea8" stroke="none"/>
      <circle cx="18" cy="15" r="0.9" fill="#6b4ea8" stroke="none"/>
      <circle cx="23" cy="15" r="0.9" fill="#6b4ea8" stroke="none"/>
    </g>

    <!-- Film reel -->
    <g transform="translate(28 168) rotate(12 15 11)">
      <rect x="0" y="0" width="30" height="22" rx="2"/>
      <rect x="2"  y="2"  width="3" height="3"/>
      <rect x="9"  y="2"  width="3" height="3"/>
      <rect x="16" y="2"  width="3" height="3"/>
      <rect x="23" y="2"  width="3" height="3"/>
      <rect x="2"  y="17" width="3" height="3"/>
      <rect x="9"  y="17" width="3" height="3"/>
      <rect x="16" y="17" width="3" height="3"/>
      <rect x="23" y="17" width="3" height="3"/>
      <circle cx="14" cy="11" r="3"/>
    </g>

    <!-- Lightbulb -->
    <g transform="translate(178 172)">
      <path d="M7 18 Q2 13 4 6 Q9 0 13 0 Q18 0 22 6 Q24 13 19 18 Q18 21 18 24 L8 24 Q8 21 7 18 Z"/>
      <line x1="9"  y1="27" x2="18" y2="27"/>
      <line x1="10" y1="30" x2="17" y2="30"/>
    </g>

  </g>
</svg>
